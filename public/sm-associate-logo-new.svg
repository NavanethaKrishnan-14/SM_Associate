<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 260" role="img" aria-labelledby="title desc">
<title id="title">SM Associate</title>
<desc id="desc">SM Associate premium finance and mobility logo</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8df9b"/>
    <stop offset=".28" stop-color="#c5a35b"/>
    <stop offset=".58" stop-color="#fff0bb"/>
    <stop offset="1" stop-color="#a77e2f"/>
  </linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#122842"/>
    <stop offset="1" stop-color="#07131f"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".22"/>
  </filter>
</defs>

<g filter="url(#shadow)">
  <circle cx="126" cy="130" r="96" fill="url(#navy)" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="126" cy="130" r="84" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>
  <text x="73" y="161" font-family="Georgia, Times New Roman, serif" font-size="112" font-weight="700" fill="url(#gold)">S</text>
  <text x="125" y="171" font-family="Georgia, Times New Roman, serif" font-size="92" font-weight="700" fill="#fff">M</text>
  <path d="M56 151 C95 126 143 121 190 92" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>
  <path d="M157 83 l10 -18 10 18" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M175 78 l10 -18 10 18" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g transform="translate(252 48)">
  <text x="0" y="82" font-family="Georgia, Times New Roman, serif" font-size="86" font-weight="700" letter-spacing="1.8" fill="#07131f">ASSOCIATE</text>
  <path d="M4 104 H760" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <text x="3" y="135" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#718293">YOUR GOALS  •  OUR SUPPORT</text>
  <g transform="translate(3 164)">
    <circle cx="10" cy="9" r="6" fill="#c5a35b"/>
    <path d="M35 15 L58 0 L81 15" fill="none" stroke="#c5a35b" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 14 V37 H72 V14" fill="none" stroke="#c5a35b" stroke-width="4" stroke-linejoin="round"/>
    <text x="98" y="25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#718293">FINANCE • MOBILITY • SUPPORT</text>
  </g>
</g>
</svg>